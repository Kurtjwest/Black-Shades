<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Shades</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #b8b8b8;
               font: 13px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  /* room at the bottom for the bar, so it never sits over the game's own HUD */
  #canvas { display: block; background: #000; border: 0; outline: none;
            max-width: 100vw; max-height: calc(100vh - 34px); }
  #canvas.loading { display: none; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 10px;
           display: flex; gap: 14px; align-items: center; justify-content: center;
           background: rgba(0,0,0,.6); font-size: 12px; }
  #panel.hidden { display: none; }
  #status { min-width: 20em; text-align: center; }
  #bar { width: 260px; height: 4px; background: #222; }
  #bar > div { height: 100%; width: 0; background: #888; }
  button { font: inherit; color: #ddd; background: #1c1c1c; border: 1px solid #444;
           padding: 3px 10px; cursor: pointer; }
  button:hover { background: #2a2a2a; }
  #splash { text-align: center; max-width: 34em; padding: 0 1em; }
  #splash h1 { font-weight: 300; letter-spacing: .35em; margin: 0 0 .2em; font-size: 28px; color: #eee; }
  #splash p { margin: .4em 0; }
  #splash .dim { color: #777; }
  .dim { color: #777; }

  /* config.txt, edited in place - the game only reads it at startup, so
     saving reloads the page */
  #settings { position: fixed; inset: 0; background: rgba(0,0,0,.88);
              display: none; flex-direction: column; align-items: center;
              justify-content: center; gap: 10px; padding: 20px; z-index: 10; }
  #settings.open { display: flex; }
  #settings h2 { font-weight: 400; font-size: 15px; margin: 0; color: #eee;
                 letter-spacing: .1em; }
  #settingstext { width: min(680px, 92vw); height: min(60vh, 620px);
                  font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
                  color: #ddd; background: #101010; border: 1px solid #333;
                  padding: 10px; resize: vertical; white-space: pre; }
  #settingsrow { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>

<div id="splash">
  <h1>BLACK SHADES</h1>
  <p class="dim">David Rosen, 2002 &mdash; SDL2 port, in the browser</p>
  <p id="status">loading&hellip;</p>
  <div id="bar" style="margin: 0 auto"><div id="barfill"></div></div>
</div>

<canvas id="canvas" class="loading" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

<div id="panel" class="hidden">
  <span class="dim">click the game to take the mouse &mdash; Esc lets go</span>
  <button id="settingsbutton">Settings</button>
  <button id="fullscreen">Fullscreen</button>
</div>

<div id="settings">
  <h2>config.txt</h2>
  <textarea id="settingstext" spellcheck="false"></textarea>
  <div id="settingsrow">
    <button id="settingssave">Save and restart</button>
    <button id="settingscancel">Cancel</button>
    <button id="settingsreset">Reset to defaults</button>
    <span class="dim">the game reads this once, at startup</span>
  </div>
</div>

<script>
(function () {
  var canvas   = document.getElementById('canvas');
  var splash   = document.getElementById('splash');
  var statusEl = document.getElementById('status');
  var barfill  = document.getElementById('barfill');
  var panel    = document.getElementById('panel');

  // The game asks SDL for a window and SDL sizes the canvas to match, so the
  // size comes from config.txt rather than from here.
  function running() {
    splash.style.display = 'none';
    canvas.classList.remove('loading');
    panel.classList.remove('hidden');
    canvas.focus();
  }

  // ---- config.txt, edited from the page -------------------------------
  // The game writes the file itself the first time it runs and reads it only
  // at startup, so this edits what is there and starts again.
  var settings     = document.getElementById('settings');
  var settingstext = document.getElementById('settingstext');
  var CONFIG       = '/blackshades/config.txt';

  function closeSettings() {
    settings.classList.remove('open');
    canvas.focus();
  }

  // Keys typed in here must not also reach the game: SDL listens on the
  // window, so stopping the event on its way up is enough, and the textarea
  // itself still gets it.
  ['keydown', 'keyup', 'keypress'].forEach(function (ev) {
    settings.addEventListener(ev, function (e) { e.stopPropagation(); });
  });

  function saveAndReload(text) {
    try {
      if (text === null) FS.unlink(CONFIG);      // reset: the game rewrites it
      else FS.writeFile(CONFIG, text);
      FS.syncfs(false, function (err) {
        if (err) { alert('could not save: ' + err); return; }
        location.reload();
      });
    } catch (e) {
      alert('could not save: ' + e);
    }
  }

  document.getElementById('settingsbutton').addEventListener('click', function () {
    var text;
    try {
      text = new TextDecoder().decode(FS.readFile(CONFIG));
    } catch (e) {
      text = null;
    }
    if (text === null) {
      alert('No config.txt yet - the game writes one as it starts. ' +
            'Give it a moment and try again.');
      return;
    }
    if (document.exitPointerLock) document.exitPointerLock();
    settingstext.value = text;
    settings.classList.add('open');
    settingstext.focus();
  });

  document.getElementById('settingssave').addEventListener('click', function () {
    saveAndReload(settingstext.value);
  });
  document.getElementById('settingscancel').addEventListener('click', closeSettings);
  document.getElementById('settingsreset').addEventListener('click', function () {
    if (confirm('Put every setting back to the way it shipped?')) saveAndReload(null);
  });

  document.getElementById('fullscreen').addEventListener('click', function () {
    if (canvas.requestFullscreen) canvas.requestFullscreen();
    else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
    canvas.focus();
  });

  // Keys have to reach the game rather than scrolling the page.
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].indexOf(e.code) >= 0)
      e.preventDefault();
  }, false);

  window.Module = {
    canvas: canvas,
    print:    function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },

    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      if (left === 0) return;
      var done = this.totalDependencies - left;
      barfill.style.width = (100 * done / this.totalDependencies) + '%';
    },
    setStatus: function (text) {
      var m = /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/.exec(text);
      if (m) {
        barfill.style.width = (100 * parseFloat(m[2]) / parseFloat(m[4])) + '%';
        text = m[1];
      }
      statusEl.textContent = text || '';
      if (!text) running();
    },
    onRuntimeInitialized: running
  };

  window.onerror = function (message) {
    statusEl.textContent = 'it stopped: ' + message + ' (the console has the rest)';
    splash.style.display = '';
  };
})();
</script>
<script async src="blackshades.js"></script>
</body>
</html>
